[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rtdaas-fleet-wear"
version = "0.1.0"
description = "Fleet dashboard of how far each robot joint has moved, and load-weighted wear"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27",
  "numpy>=1.26",
  "pandas>=2.1",
  "starlette>=0.37",
  "uvicorn>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
rtdaas-fleet-wear = "fleet_wear.cli:main"

[tool.setuptools.packages.find]
include = ["fleet_wear*"]

[tool.setuptools.package-data]
fleet_wear = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: needs a running API at RTDAAS_API_URL"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
